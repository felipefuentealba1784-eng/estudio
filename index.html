function gcalEnlace({ titulo, fecha, hora, min = 30, detalles = '', recur }) {
  const p = new URLSearchParams({ action: 'TEMPLATE', text: titulo, details: detalles, ctz: 'America/Santiago' });
  const f = fecha.replace(/-/g, '');
  if (hora) {
    const [h, m] = hora.split(':').map(Number), fin = new Date(2000, 0, 1, h, m + min);
    p.set('dates', `${f}T${pad(h)}${pad(m)}00/${f}T${pad(fin.getHours())}${pad(fin.getMinutes())}00`);
  } else p.set('dates', `${f}/${sumaDias(fecha, 1).replace(/-/g, '')}`);
  if (recur) p.set('recur', recur);
  return 'https://calendar.google.com/calendar/render?' + p.toString().replace(/\+/g, '%20');
}

}

}

/* ===== Plan sugerido para una evaluación ===== */
function planSesiones(e) {
  const hoy = hoyYmd(), d = difDias(hoy, e.fecha); if (d < 1) return [];
  let offs = d >= 8 ? [-7, -5, -3, -1] : d >= 5 ? [-4, -2, -1] : d >= 2 ? [-2, -1] : [-1];
  let fechas = offs.map(o => sumaDias(e.fecha, o)).filter(f => f >= hoy);
  if (!fechas.length) fechas = [hoy];
  const g = guiaAsig(asigPor(e.asig).nombre), tecs = e.tipo === 'control' ? ['reparte', 'prueba', 'porque', 'prueba'] : [g.tec[1] || 'porque', g.tec[0], 'mezcla', 'prueba'];
  return fechas.map((f, i) => ({ fecha: f, min: i === fechas.length - 1 ? 15 : 25, tec: i === fechas.length - 1 ? 'prueba' : tecs[i % tecs.length] }));
}

function esNoche() { const [h, m] = (AJ.dormir || '22:00').split(':').map(Number), n = new Date(); return n.getHours() * 60 + n.getMinutes() >= h * 60 + m || n.getHours() < 5; }

function vCalendario() {
  const f = S.filtro, asigs = asigOrden(), base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + S.mesOff);
  const evs = eventosOrden().filter(e => !f || e.asig === f);
  let h = `<div class="top"><h1>Calendario</h1><button class="btn pr sm" data-a="nuevo">${ic('plus')} Agregar</button></div>
  <div class="chips scroll mb"><button class="chip" data-a="filtro" data-v="" aria-pressed="${!f}">Todas</button>${asigs.map(a => `<button class="chip" data-a="filtro" data-v="${a.id}" aria-pressed="${f === a.id}"><i class="pt" style="background:${a.color}"></i>${esc(a.nombre)}</button>`).join('')}</div>`;
  if (f) {
    const a = asigPor(f);
    h += `<div class="card" style="border-color:${a.color};border-width:2px"><div class="fila entre"><div><h2>${esc(a.nombre)}</h2><p class="sub">${a.profe ? 'Profe: ' + esc(a.profe) : 'Sin profesor anotado'}</p></div><button class="icono" data-a="edit-asig" data-id="${a.id}" aria-label="Editar asignatura">${ic('lapiz')}</button></div>
      <div class="grid2 mt"><button class="btn sm" data-a="correo" data-id="${a.id}">${ic('mail')} Escribir</button><button class="btn sm" data-a="nuevo" data-asig="${a.id}">${ic('plus')} Evaluación</button></div></div>`;
  }
  const y = base.getFullYear(), m = base.getMonth(), ini = new Date(y, m, 1), off = (ini.getDay() + 6) % 7, dias = new Date(y, m + 1, 0).getDate(), hoy = hoyYmd();
  let celdas = '';
  for (let k = 0; k < 42; k++) {
    const d = new Date(y, m, 1 - off + k), s = ymd(d); if (k >= 35 && d.getMonth() !== m) break;
    const ev = evs.filter(e => e.fecha === s).slice(0, 4);
    celdas += `<button class="dia ${d.getMonth() !== m ? 'otro' : ''} ${s === hoy ? 'hoy' : ''}" data-a="dia" data-v="${s}" aria-pressed="${S.diaSel === s}" aria-label="${fechaLarga(s)}${ev.length ? ', ' + ev.length + ' eventos' : ''}">${d.getDate()}<span class="puntos">${ev.map(e => `<i style="background:${asigPor(e.asig).color};box-shadow:0 0 0 1px rgba(0,0,0,.15)"></i>`).join('')}</span></button>`;
  }
  h += `<div class="card"><div class="fila entre mb"><button class="icono" data-a="mes" data-v="-1" aria-label="Mes anterior">${ic('back')}</button><h3>${cap(MESES[m])} ${y}</h3><button class="icono" data-a="mes" data-v="1" aria-label="Mes siguiente" style="transform:scaleX(-1)">${ic('back')}</button></div>
    <div class="mes">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span class="cab">${x}</span>`).join('')}${celdas}</div></div>`;
  if (S.diaSel) {
    const l = evs.filter(e => e.fecha === S.diaSel);
    h += `<div class="fila entre mb"><h3>${cap(fechaLarga(S.diaSel))}</h3><button class="btn sm suave" data-a="dia" data-v="">Ver próximos</button></div>${l.length ? l.map(vEvItem).join('') : '<p class="vacio">Nada este día.</p>'}<button class="btn w mt" data-a="nuevo" data-fecha="${S.diaSel}" ${f ? `data-asig="${f}"` : ''}>${ic('plus')} Agregar para este día</button>`;
  } else {
    const fut = evs.filter(e => e.fecha >= hoy), pas = evs.filter(e => e.fecha < hoy).reverse();
    h += `<h3 class="mb">Próximos</h3>${fut.length ? fut.map(vEvItem).join('') : '<p class="vacio">No hay nada agendado todavía.</p>'}`;
    if (pas.length) h += `<details class="mt"><summary class="sub" style="padding:10px 0">Anteriores (${pas.length})</summary>${pas.slice(0, 30).map(vEvItem).join('')}</details>`;
  }
  return h;
}

      const url = location.origin + location.pathname + '#unir=' + AJ.codigo, txt = `Te invito a Ronrutina, el calendario de estudio de ${estudiante()} 🐾`;
      try { if (navigator.share) { await navigator.share({ title: 'Ronrutina', text: txt, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(url); toast('Enlace copiado. Pégalo en WhatsApp.'); } catch (e) { prompt('Copia este enlace:', url); } return;
    }
    case 'fa-copiar': try { await navigator.clipboard.writeText(AJ.codigo); toast('Código copiado'); } catch (e) { prompt('Copia el código:', AJ.codigo); } return;
    case 'fa-salir': if (!confirm('¿Salir de esta familia en este teléfono? Podrás volver con el código.')) return; DB.unsubs.forEach(u => { try { u(); } catch (e) { } }); AJ = Object.assign({}, AJ0); guardarAjustes(); S.ob = null; location.hash = ''; return render(true);
    /* ajustes */
    case 'aj': AJ[t.dataset.k] = isNaN(+v) || v === '' ? v : +v; guardarAjustes(); return render(true);
    case 'respaldo': {
      const blob = new Blob([JSON.stringify({ fecha: new Date().toISOString(), datos: D }, null, 1)], { type: 'application/json' });
      const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = 'ronrutina-respaldo-' + hoyYmd() + '.json'; document.body.appendChild(l); l.click(); l.remove(); return toast('Respaldo descargado');
    }
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-ron]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.aj) { AJ[t.dataset.aj] = t.value.trim(); guardarAjustes(); if (t.dataset.aj === 'mochilaHora' || t.dataset.aj === 'materialesHora') render(true); }
  if (t.dataset.ajc) { AJ[t.dataset.ajc] = t.checked; guardarAjustes(); }
  if (t.id === 'fa-est') { const n = t.value.trim(); if (n) put('config', Object.assign({}, cfg('familia'), { id: 'familia', estudiante: n })); }
});

/* ===== Arranque ===== */
async function arrancar() {
  cargarAjustes(); aplicarTema();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  irVista();
  if (AJ.codigo && AJ.rol) await conectar(AJ.codigo);
  render(true);
}
window.addEventListener('load', arrancar);

</script>
