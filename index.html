<style>

/* ===== Archivos adjuntos (rúbricas, instrucciones) =====
   Se guardan en la misma base de datos, partidos en trozos de ~700 KB
   (cada documento de Firestore admite hasta 1 MB). Así no hace falta
   activar Firebase Storage, que exige un plan de pago. */
const TROZO = 700000, MAX_ARCHIVO = 8 * 1024 * 1024;
const archivosDe = evId => (D.archivos || []).filter(a => a.ev === evId).sort((a, b) => (a.act || 0) - (b.act || 0));
const ARCH_CACHE = {};
const tamTxt = b => b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const icArchivo = m => /pdf/.test(m) ? '📕' : /image/.test(m) ? '🖼️' : /word|document|msword/.test(m) ? '📘' : '📄';

function bloqueArchivos(e) {
  const l = archivosDe(e.id);
  return `<h3 class="mt2">Rúbricas e instrucciones</h3>
    ${l.length ? `<div class="mt">${l.map(a => `<div class="archivo"><button class="archivo-ab" data-a="arch-abrir" data-id="${a.id}"><span style="font-size:24px">${icArchivo(a.mime)}</span><span class="txt"><b>${esc(a.nombre)}</b><small>${tamTxt(a.tam)} · subido por ${esc(a.por || '')}</small></span></button><button class="icono chico" data-a="arch-borrar" data-id="${a.id}" aria-label="Eliminar ${esc(a.nombre)}">${ic('x')}</button></div>`).join('')}</div>` : `<p class="sub mt">Adjunta la pauta, la rúbrica o las instrucciones del profe (PDF, Word o foto).</p>`}
    <label class="btn sm w mt adjuntar">📎 Adjuntar archivo<input type="file" id="f-archivo" data-ev="${e.id}" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.heic,application/pdf,image/*,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="sr"></label>`;
}

const leerComo = (file, modo) => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => mal(r.error); modo === 'url' ? r.readAsDataURL(file) : r.readAsArrayBuffer(file); });
async function comprimirImagen(file) {
  if (!/^image\/(png|jpe?g|webp)/.test(file.type) || file.size < 600 * 1024) return file;
  try {
    const url = await leerComo(file, 'url'), img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url; });
    const k = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', .85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}
async function subirArchivo(file, evId) {
  if (!file) return;
  if (DB.modo !== 'nube') return toast('Para adjuntar archivos necesitas conexión con la nube.');
  file = await comprimirImagen(file);
  if (file.size > MAX_ARCHIVO) return toast('El archivo pesa ' + tamTxt(file.size) + '. El máximo es 8 MB. Prueba con una foto o un PDF más liviano.');
  const datos = await leerComo(file, 'url'), b64 = datos.slice(datos.indexOf(',') + 1);
  const id = uid(), partes = Math.ceil(b64.length / TROZO) || 1;
  try {
    for (let i = 0; i < partes; i++) {
      if (partes > 1) toast(`Subiendo ${esc(file.name)}… ${Math.round(i / partes * 100)}%`);
      await window.FB.setDoc(window.FB.doc(DB.fs, 'familias', DB.codigo, 'trozos', id + '_' + i), { d: b64.slice(i * TROZO, (i + 1) * TROZO), i, de: id });
    }
  } catch (e) { console.warn(e); return toast('No se pudo subir el archivo. Revisa tu conexión.'); }
  const mime = file.type || ({ pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' })[(file.name.split('.').pop() || '').toLowerCase()] || 'application/octet-stream';
  await put('archivos', { id, ev: evId, nombre: file.name, mime, tam: file.size, partes });
  toast('Archivo guardado 📎');
  if ($('.hoja')) verEvento(evId);
}
async function bajarArchivo(a) {
  if (ARCH_CACHE[a.id]) return ARCH_CACHE[a.id];
  let b64 = '';
  for (let i = 0; i < a.partes; i++) {
    const s = await window.FB.getDoc(window.FB.doc(DB.fs, 'familias', DB.codigo, 'trozos', a.id + '_' + i));
    if (!s.exists()) throw new Error('falta un trozo');
    b64 += s.data().d;
  }
  const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return (ARCH_CACHE[a.id] = URL.createObjectURL(new Blob([u8], { type: a.mime })));
}
async function abrirArchivo(id) {
  const a = (D.archivos || []).find(x => x.id === id); if (!a) return;
  if (DB.modo !== 'nube') return toast('Necesitas conexión para abrir archivos.');
  const verDirecto = /pdf|image/.test(a.mime);
  const el = abrirHoja(`${cabHoja(a.nombre)}<p class="sub" id="arch-est">Descargando… 🐾</p><div id="arch-acc" class="col mt"></div>`);
  try {
    const url = await bajarArchivo(a), acc = $('#arch-acc'); if (!acc) return;
    $('#arch-est').textContent = tamTxt(a.tam) + (verDirecto ? '' : ' · Se abrirá con Word o la app de archivos de tu teléfono.');
    acc.innerHTML = `${/image/.test(a.mime) ? `<img src="${url}" alt="${esc(a.nombre)}" style="width:100%;border-radius:14px;border:1px solid var(--borde)">` : ''}
      ${verDirecto ? `<a class="btn pr big" href="${url}" target="_blank" rel="noopener">Abrir</a>` : ''}
      <a class="btn ${verDirecto ? '' : 'pr big'}" href="${url}" download="${esc(a.nombre)}">Descargar</a>
      <button class="btn suave" data-a="ver" data-id="${a.ev}">Volver a la evaluación</button>`;
  } catch (e) { console.warn(e); const s = $('#arch-est'); if (s) s.textContent = 'No se pudo descargar. Revisa tu conexión e inténtalo otra vez.'; }
  return el;
}
async function borrarArchivo(id) {
  const a = (D.archivos || []).find(x => x.id === id); if (!a) return;
  await borrar('archivos', id);
  if (DB.modo === 'nube') for (let i = 0; i < a.partes; i++) DB.FBdel('trozos', a.id + '_' + i);
  toast('Archivo eliminado'); verEvento(a.ev);
}

async function marcarMision(id) {
  const c = misCfg(), hoy = hoyYmd(), hechos = {}, desde = sumaDias(hoy, -60);

  const ya = hechos[hoy][id], l = misionesDe(hoy, c);
  const antesTodas = l.length && l.every(m => hechos[hoy][m.id]);
  if (ya) delete hechos[hoy][id]; else hechos[hoy][id] = { q: AJ.nombre, r: AJ.rol, t: horaAhora() };

  if (top) ins.push(`La emoción que más sentiste fue <b>${EMOS[top[0]][0]} ${EMOS[top[0]][1].toLowerCase()}</b> (${top[1]} ${top[1] === 1 ? 'día' : 'días'}).`);
  const pos = dias.filter(d => POSITIVAS.includes(d.emo)).length, neg = dias.filter(d => d.emo && !POSITIVAS.includes(d.emo)).length;
  if (pos + neg) ins.push(pos >= neg ? `Tuviste <b>${pos}</b> ${pos === 1 ? 'día' : 'días'} con buen ánimo. ¿Qué los hizo especiales?` : `Fue una semana exigente: <b>${neg}</b> ${neg === 1 ? 'día' : 'días'} con emociones difíciles. Igual seguiste adelante 🧡`);

  const sesD = new Set(D.sesiones.filter(s => s.fecha >= ini && s.fecha <= fin).map(s => s.fecha)), estPos = dias.filter(d => sesD.has(d.f) && POSITIVAS.includes(d.emo)).length;
  if (estPos) ins.push(`Los días que estudiaste, ${estPos === 1 ? 'uno lo terminaste' : estPos + ' los terminaste'} con buen ánimo. ¡Avanzar se siente bien!`);

const sinTilde = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* Busca fecha y hora en el texto. Devuelve {fecha, hora, resto} */
function leerFechaHora(txt) {
  let t = ' ' + sinTilde(txt) + ' ', fecha = null, hora = null; const usados = [];
  const hoy = hoyYmd(), quita = re => { usados.push(String(re)); t = t.replace(re, ' '); };
  const m0 = t.match(/\b(en|por) la (manana|tarde|noche)\b/);
  if (m0) { hora = { manana: '09:00', tarde: '16:00', noche: '20:00' }[m0[2]]; quita(m0[0]); }
  let m = t.match(/\b(?:a las |a la |las )?(\d{1,2})(?:[:.h](\d{2}))\s*(am|pm|hrs?|h)?\b/) || t.match(/\ba las? (\d{1,2})\s*(am|pm|hrs?|h)?\b/) || t.match(/\b(\d{1,2})\s*(am|pm|hrs?)\b/);
  if (m) {
    let h = +m[1], mi = 0, suf = '';
    if (m.length === 4) { mi = +(m[2] || 0); suf = m[3] || ''; } else suf = m[2] || '';
    if (suf === 'pm' && h < 12) h += 12; if (suf === 'am' && h === 12) h = 0;
    if (!suf && h >= 1 && h <= 7) h += 12;
    if (h <= 23 && mi <= 59) { hora = pad(h) + ':' + pad(mi); quita(m[0]); }
  }
  if ((m = t.match(/\bpasado manana\b/))) { fecha = sumaDias(hoy, 2); quita(m[0]); }
  else if ((m = t.match(/\bmanana\b/))) { fecha = sumaDias(hoy, 1); quita(m[0]); }
  else if ((m = t.match(/\bhoy\b/))) { fecha = hoy; quita(m[0]); }
  if (!fecha && (m = t.match(/\ben (\d{1,2}) (dias?|semanas?)\b/))) { fecha = sumaDias(hoy, +m[1] * (m[2].startsWith('semana') ? 7 : 1)); quita(m[0]); }
  if (!fecha && (m = t.match(/\b(?:la )?(?:proxima|otra) semana\b|\bla semana que viene\b/))) { const dw = deYmd(hoy).getDay(); fecha = sumaDias(hoy, ((8 - dw) % 7) || 7); quita(m[0]); }
  if (!fecha && (m = t.match(/\b(\d{1,2})\s*(?:de\s+)?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre|ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)\b/))) {
    const mes = MESES_N.indexOf(m[2] === 'setiembre' ? 'septiembre' : m[2]) >= 0 ? MESES_N.indexOf(m[2] === 'setiembre' ? 'septiembre' : m[2]) : MES_CORTO[m[2]];

/* ----- activar, sincronizar, probar ----- */
async function activarAvisos() {
  if (!soportaPush()) return toast(esIOS && !esStandalone() ? 'En iPhone, primero instala la app en la pantalla de inicio y ábrela desde el ícono.' : 'Este navegador no permite notificaciones.');
  const permiso = Notification.requestPermission();
  const inp = $('#av-url'), url = ((inp && inp.value) || urlAvisos()).replace(/[\s\u200B-\u200D\uFEFF]/g, '').replace(/\/+$/, '');
  if (!/^https:\/\/[^/]+\.[^/]+/.test(url)) return toast('Pega la dirección del servidor de avisos (empieza con https://).');
  if (url !== urlAvisos()) { try { await put('config', Object.assign({}, cfg('avisos'), { id: 'avisos', url })); } catch (e) { } }
  if ((await permiso) !== 'granted') return toast('Necesito tu permiso para mandarte avisos. Puedes darlo en los ajustes del teléfono.');
  const fallo = (msg, e) => { console.warn(e); avisoError(msg + (e ? ` (${(e.name || '') + (e.message ? ': ' + e.message : '')})` : '')); };
  /* 1. leer la clave del servidor */
  let clave;
  try { const r = await fetch(url + '/clave', { cache: 'no-store' }); if (!r.ok) throw new Error('estado ' + r.status); clave = (await r.json()).clave; if (!clave) throw new Error('sin clave'); }
  catch (e) { return fallo('Paso 1: no pude leer el servidor. Revisa que la dirección sea exacta y que tengas internet', e); }
  /* 2. suscribir el teléfono */
  let sub;
  try {
    const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error('el servicio de la app no está listo')), 8000))]);
    sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey) { const k = new Uint8Array(sub.options.applicationServerKey); if (k.length && btoa(String.fromCharCode(...k)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') !== clave) { await sub.unsubscribe(); sub = null; } }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: ub64App(clave) });
  } catch (e) { return fallo('Paso 2: el teléfono no aceptó la suscripción a avisos. Abre la app desde Chrome (en Brave: Configuración → Privacidad → activa «Usar los servicios de Google para mensajes push»)', e); }
  /* 3. guardar los avisos en el servidor */
  const ant = pushLS(); guardarPushLS({ id: (ant && ant.id) || uid() + uid(), url, hash: '', ult: 0 });
  const ok = await sincronizarAvisos(true);
  if (ok) { toast('¡Avisos activados! 🔔 Ron te avisará aunque la app esté cerrada.'); sonido('feliz'); render(true); }
  else { const b = $('#av-error'); if (!b || b.hidden) avisoError('Paso 3: no pude guardar los avisos en el servidor. Revisa tu internet e inténtalo de nuevo.'); }
}
/* deja el error a la vista (los toast duran poco) */
function avisoError(msg) { toast('No se pudo activar. Mira el detalle en pantalla.'); const b = $('#av-error'); if (b) { b.textContent = msg; b.hidden = false; } }
async function sincronizarAvisos(forzar) {

    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (!sub) { guardarPushLS(null); return false; }
    const r = await fetch(st.url + '/registrar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: st.id, sub: sub.toJSON(), avisos }) });
    if (!r.ok) throw new Error('estado ' + r.status);
    guardarPushLS(Object.assign(st, { hash: h, ult: Date.now(), n: avisos.length })); return true;
  } catch (e) { console.warn(e); if (forzar) avisoError('Paso 3: el servidor no guardó los avisos (' + (e.message || e) + ').'); return false; }

    case 'des-empezar': await put('config', { id: 'desafio', inicio: semanaKey(), marcas: {} }); return render(true);
    case 'des-probe': { const dd = Object.assign({ id: 'desafio' }, cfg('desafio')); dd.marcas = Object.assign({}, dd.marcas); dd.marcas[v] = Object.assign({}, dd.marcas[v], { probe: true }); await put('config', dd); return render(true); }
    case 'des-sirvio': { const dd = Object.assign({ id: 'desafio' }, cfg('desafio')); dd.marcas = Object.assign({}, dd.marcas); dd.marcas[v] = Object.assign({}, dd.marcas[v], { sirvio: t.dataset.s === '1' }); await put('config', dd); return render(true); }
    case 'confianza': { const e = D.eventos.find(x => x.id === id); await put('eventos', Object.assign({}, e, { confianza: +v })); $$('[data-a=confianza]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); return; }
    case 'resultado': { const e = D.eventos.find(x => x.id === id); await put('eventos', Object.assign({}, e, { resultado: v })); cerrarHoja(true); verEvento(id); return; }
    /* correo */
    case 'correo': cerrarHoja(true); return abrirCorreo(id, t.dataset.ev);
    case 'correo-tipo': return abrirCorreo(id, t.dataset.ev, v);
    case 'correo-abrir': return correoAbrir(v, id);
    /* horario */
    case 'h-dia': S.hDia = +v; return render(true);
    case 'h-agrega': return cambiaHorario(l => l.push(id));
    case 'h-quita': return cambiaHorario(l => l.splice(+t.dataset.i, 1));
    case 'h-sube': return cambiaHorario(l => { const i = +t.dataset.i; [l[i - 1], l[i]] = [l[i], l[i - 1]]; });
    /* asignaturas */
    case 'edit-asig': return editarAsig(id);
    case 'a-color': S.asigEd.color = v; $$('[data-a=a-color]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); return;
    case 'a-guardar': { const x = S.asigEd, dia = x.alDia; delete x.alDia; x.nombre = $('#a-nom').value.trim(); x.profe = $('#a-profe').value.trim(); x.correo = $('#a-correo').value.trim(); if (!x.nombre) return toast('Escribe el nombre.'); const g = await put('asig', x); cerrarHoja(); if (dia) { S.hDia = dia; cambiaHorario(l => l.push(g.id)); return toast(`${x.nombre} agregada al ${DIAS[dia]} 🐾`); } return toast('Guardado'); }
    case 'h-nueva': editarAsig(null); S.asigEd.alDia = S.hDia; return;
    case 'tipo-borrar': { if (D.eventos.some(e => e.tipo === id) && !confirm('Hay evaluaciones con este tipo. Seguirán guardadas, pero el tipo dejará de aparecer en la lista. ¿Quitarlo?')) return; await put('config', { id: 'tipos', lista: tiposExtra().filter(t => t.id !== id) }); return render(true); }
    case 'cal-vista': AJ.calVista = v; guardarAjustes(); S.diaSel = ''; return render(true);
    case 'sem': S.semOff = v === '0' ? 0 : (S.semOff || 0) + +v; return render(true);
    case 'f-tipo-otro': leerForm(); S.formTipoNuevo = !S.formTipoNuevo; S.formPinta(); setTimeout(() => { const x = $('#f-tiponom'); if (x) x.focus(); }, 50); return;
    case 'f-tipo-color': S.formTipoColor = v; $$('[data-a=f-tipo-color]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); return;
    case 'f-tipo-crear': {
      const n = ($('#f-tiponom').value || '').trim(); if (!n) return toast('Escribe qué se evalúa.');
      leerForm(); const ex = tiposTodos().find(t => t.n.toLowerCase() === n.toLowerCase());
      if (ex) S.form.tipo = ex.id; else { const nt = { id: 'c_' + uid().slice(0, 8), n: cap(n), color: S.formTipoColor || TIPO_PALETA[tiposExtra().length % TIPO_PALETA.length] }; await put('config', { id: 'tipos', lista: [...tiposExtra(), nt] }); S.form.tipo = nt.id; }
      S.formTipoNuevo = false; S.formTipoColor = null; return S.formPinta();
    }
    case 'arch-abrir': return abrirArchivo(id);
    case 'arch-borrar': if (t.dataset.ok) return borrarArchivo(id); t.dataset.ok = '1'; t.innerHTML = '¿Borrar?'; t.style.width = 'auto'; t.style.padding = '0 10px'; return;
    case 'a-borrar': if (t.dataset.ok) { await borrar('asig', id); cerrarHoja(); return toast('Asignatura eliminada'); } t.dataset.ok = '1'; t.textContent = '¿Seguro? Toca otra vez'; return;
    /* familia */
    case 'fa-compartir': {
      const url = location.origin + location.pathname + '#unir=' + AJ.codigo, txt = `Te invito a Ronrutina, el calendario de estudio de ${estudiante()} 🐾`;
      try { if (navigator.share) { await navigator.share({ title: 'Ronrutina', text: txt, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(url); toast('Enlace copiado. Pégalo en WhatsApp.'); } catch (e) { prompt('Copia este enlace:', url); } return;
    }
    case 'fa-copiar': try { await navigator.clipboard.writeText(AJ.codigo); toast('Código copiado'); } catch (e) { prompt('Copia el código:', AJ.codigo); } return;
    case 'fa-salir': if (!confirm('¿Salir de esta familia en este teléfono? Podrás volver con el código.')) return; DB.unsubs.forEach(u => { try { u(); } catch (e) { } }); DB.unsubs = []; Object.values(ESP).forEach(e => { e.unsubs.forEach(u => { try { u(); } catch (x) { } }); e.unsubs = []; e.codigo = ''; e.cols.forEach(c => e.D[c] = []); }); COLS.forEach(c => D[c] = []); S.fraseFija = null; AJ = Object.assign({}, AJ0); guardarAjustes(); S.ob = null; location.hash = ''; return render(true);
    /* ajustes */
    case 'aj': AJ[t.dataset.k] = isNaN(+v) || v === '' ? v : +v; guardarAjustes(); return render(true);
    case 'respaldo': {
      const blob = new Blob([JSON.stringify({ fecha: new Date().toISOString(), datos: D }, null, 1)], { type: 'application/json' });
      const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = 'ronrutina-respaldo-' + hoyYmd() + '.json'; document.body.appendChild(l); l.click(); l.remove(); return toast('Respaldo descargado');
    }
  }
});
document.addEventListener('focusin', e => { if (e.target.id === 'pl-as' || e.target.id === 'pl-cu') S.plUlt = e.target.id; });
document.addEventListener('input', e => { if (e.target.id === 'deco-op') { AJ.decoOp = +e.target.value; const x = $('#deco-txt'), op = AJ.decoOp; if (x) x.textContent = op < 14 ? 'muy suave' : op < 28 ? 'suave' : op < 44 ? 'media' : 'bien visible'; try { document.body.style.backgroundImage = fondoSVG(); } catch (z) { } } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'as-txt') { e.preventDefault(); return asistenteIr(); } if (e.key === 'Enter' && e.target.id === 'hc-n') { e.preventDefault(); const b = $('[data-a=hc-add]'); if (b) b.click(); return; } if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-ron]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.aj) { AJ[t.dataset.aj] = t.value.trim(); guardarAjustes(); if (/^(av|mochilaHora|materialesHora|dormir|corte|horaEstudio)/.test(t.dataset.aj)) refrescarAvisos(); if ((t.dataset.aj === 'mochilaHora' || t.dataset.aj === 'materialesHora') && S.vista !== 'mas-avisos') render(true); }
  if (t.dataset.ajc) { AJ[t.dataset.ajc] = t.checked; guardarAjustes(); }
  if (t.dataset.av) { AJ.av = Object.assign({}, avCfg(), { [t.dataset.av]: t.checked }); guardarAjustes(); refrescarAvisos(); return; }
  if (t.dataset.avt) return cambiaAvt(t);
  if (t.id === 'deco-op') { AJ.decoOp = +t.value; guardarAjustes(); return; }
  if (t.id === 'f-archivo' && t.files && t.files[0]) { const f = t.files[0]; t.value = ''; subirArchivo(f, t.dataset.ev); return; }
  if (t.dataset.mis === 'activo') { put('config', Object.assign({}, misCfg(), { id: 'misiones', activo: t.checked })).then(() => render(true)); return; }
  if (t.dataset.gato) {
    const k = t.dataset.gato;
    if (k === 'activo') put('config', Object.assign({}, gatoCfg(), { id: 'gato', activo: t.checked })).then(() => render(true));
    else if (k === 'on') gatoCambia(t.dataset.id, { on: t.checked });
    else if (k === 'h' && t.value) gatoCambia(t.dataset.id, { h: t.value });
  }
  if (t.id === 'fa-est') { const n = t.value.trim(); if (n) put('config', Object.assign({}, cfg('familia'), { id: 'familia', estudiante: n })); }
});

/* ===== Arranque ===== */
async function arrancar() {
  cargarAjustes(); aplicarTema();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  irVista();
  if (AJ.codigo && AJ.rol) { await conectar(AJ.codigo); await prepararMiVida(); }
  irVista();
}
window.addEventListener('load', arrancar);

</script>
